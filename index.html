<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Movies</title>
  <link rel="icon" type="image/png" href="/static/favicon.ico" />
  <link href="static/css/site.css" type="text/css" rel="stylesheet" />
  <script src="src/app.js" type="module"></script>
</head>

<body>
  <div class="container" id="container">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <a class="navbar-brand text-light" href="/">Movies</a>
      <ul class="navbar-nav ml-auto">
        <li class="nav-item user">
          <a class="nav-link" id="welcome-msg">Welcome, email</a>
        </li>
        <li class="nav-item user">
          <a class="nav-link" href="/logout">Logout</a>
        </li>
        <li class="nav-item guest">
          <a class="nav-link" href="/login">Login</a>
        </li>
        <li class="nav-item guest">
          <a class="nav-link" href="/register">Register</a>
        </li>
      </ul>
    </nav>

    <section id="home-page" class="view-section">
      <div class="jumbotron jumbotron-fluid text-light" style="background-color: #343a40">
        <img src="/images/cropped-movie-banner-e1408372575210.jpg" class="img-fluid" alt="Responsive image" />
        <h1 class="display-4">Movies</h1>
        <p class="lead">
          Unlimited movies, TV shows, and more. Watch anywhere. Cancel
          anytime.
        </p>
      </div>

      <h1 class="text-center">Movies</h1>

      <section id="add-movie-button" class="user">
        <a href="#" class="btn btn-warning">Add Movie</a>
      </section>

      <section id="movie">
        <div class="mt-3">
          <div class="row d-flex d-wrap">
            <ul id="movies-list" class="card-deck d-flex justify-content-center">
              <!-- list item example -->
              <li class="card mb-4">
                <img class="card-img-top" src="./images/movie1.jpeg" alt="Card image cap" width="400" />
                <div class="card-body">
                  <h4 class="card-title">Movie Title</h4>
                  <a href="#">
                  </a>
                </div>
                <div class="card-footer">
                  <button type="button" class="btn btn-info">Details</button>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </section>
    </section>


    <footer class="page-footer font-small">
      <div class="footer-copyright text-center py-3">
        &copy; 2025
        <a href="#" class="text-dark">JS Applications</a>
      </div>
    </footer>
  </div>
</body>

</html>
